services:
  # ============================================================
  # 1. DJANGO BACKEND
  # ============================================================
  - type: web
    name: amardoctor-backend
    runtime: python
    rootDir: backend

    buildCommand: "./build.sh"

    startCommand: "gunicorn config.wsgi:application"

    plan: free

    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"

      - key: DEBUG
        value: "False"

      - key: SECRET_KEY
        generateValue: true

      - key: DATABASE_URL
        fromDatabase:
          name: amardoctor-db
          property: connectionString

      - key: WEB_CONCURRENCY
        value: "2"

  # ============================================================
  # 2. REACT FRONTEND
  # ============================================================
  - type: web
    name: amardoctor-frontend
    runtime: static
    rootDir: frontend

    buildCommand: "npm install && npm run build"

    staticPublishPath: "dist"

    plan: free

    routes:
      - type: rewrite
        source: "/*"
        destination: "/index.html"

    envVars:
      - key: VITE_API_BASE_URL
        value: "https://amardoctor-backend.onrender.com/api"

      - key: VITE_SHOW_DEMO
        value: "true"

# ============================================================
# 3. POSTGRESQL DATABASE
# ============================================================
databases:
  - name: amardoctor-db
    plan: free
