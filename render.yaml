services:
  - type: web
    name: doctor-booking-backend
    env: python
    plan: free
    buildCommand: "pip install -r backend/requirements.txt && python backend/manage.py collectstatic --noinput"
    startCommand: "gunicorn config.wsgi --log-file -"
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings
      - key: SECRET_KEY
        generate: true
      - key: DATABASE_URL
        from: postgres
  - type: static
    name: doctor-booking-frontend
    env: static
    buildCommand: "cd frontend && npm install && npm run build"
    publishPath: "frontend/dist"
    plan: free
    envVars:
      - key: VITE_API_BASE_URL
        value: https://doctor-booking-backend.onrender.com/api
services:
  # ─── 1. Django Backend Web Service ──────────────────────────────────────────
  - type: web
    name: amardoctor-backend
    runtime: python
    rootDir: backend
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application"
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: "2"

  # ─── 2. React (Vite) Frontend Static Site ────────────────────────────────────
  - type: static
    name: amardoctor-frontend
    runtime: static
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    publishDir: "dist"
    plan: free
    routes:
      # Single Page App rewrite rule (redirect all paths to index.html for React Router)
      - type: rewrite
        source: "/*"
        destination: "/index.html"
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: amardoctor-backend
          property: url
      # Set to "true" during testing, change to "false" to hide demo UI in production
      - key: VITE_SHOW_DEMO
        value: "true"
